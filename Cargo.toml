[package]
name = "horizon-mod-colored-hearts"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A native Horizon mod: past ten hearts, the HUD's heart row tints one color per row of ten"

[lib]
# This exact source is also injected as a same-crate module by horizon-mixins.
path = "mixins/colored_hearts/runtime.rs"

[workspace]
members = ["tools/audit"]
resolver = "2"
